<title>ALLXAI - Loading</title>
<style>
  :root{ --bg:#070b12; --ink:#e8f0f7; --muted:#8598ad; --cyan:#22c9e0; --cyan2:#2f8cff; --line:#1b2838; }
  @media (prefers-reduced-motion: reduce){ .ring,.core,.bar-fill{animation:none !important} }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1100px 600px at 50% 38%, rgba(34,201,224,.12), transparent 62%),
      radial-gradient(800px 500px at 50% 90%, rgba(47,140,255,.08), transparent 60%),
      var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100vh;padding:24px}
  .stage{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:420px}
  /* logo icon (placeholder mark - swap for real asset) */
  .mark{filter:drop-shadow(0 12px 34px rgba(34,201,224,.4));animation:axIn .6s ease both, axFloat 4.6s ease-in-out .6s infinite}
  .mark svg{display:block}
  .wordmark{margin-top:20px;font-size:34px;font-weight:800;letter-spacing:1.5px;animation:axIn .6s ease .15s both}
  .wordmark .x{color:var(--cyan)}
  .tag{margin-top:6px;color:var(--cyan);font-weight:600;letter-spacing:.5px;font-size:14px}
  /* animated orb */
  .orb{position:relative;width:150px;height:150px;margin:34px 0 26px}
  .orb .core{position:absolute;inset:38%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #9ff4ff, var(--cyan) 45%, #1264c9 92%);
    box-shadow:0 0 46px rgba(34,201,224,.6), inset 0 0 22px rgba(255,255,255,.4);
    animation:pulse 2s ease-in-out infinite}
  .orb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,201,224,.35);animation:spin 6s linear infinite}
  .orb .ring.r2{inset:16%;border-color:rgba(34,201,224,.28);animation-duration:9s;animation-direction:reverse}
  .orb .ring.r3{inset:30%;border-color:rgba(47,140,255,.32);animation-duration:4.5s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.08);opacity:1}}
  /* progress */
  .track{width:280px;max-width:78vw;height:6px;border-radius:999px;background:#132030;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--cyan2));transition:width .18s ease}
  .row{display:flex;justify-content:space-between;width:280px;max-width:78vw;margin-top:10px;color:var(--muted);font-size:12.5px}
  .pct{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
  .soon{margin-top:30px;font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  @keyframes axIn{from{opacity:0;transform:scale(.82) translateY(6px)}to{opacity:1;transform:none}}
  @keyframes axFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @media (prefers-reduced-motion: reduce){ .axmark,.wordmark,.brandmark,.logo{animation:none !important} }
</style>
</head>
